name: Deploy blog to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ⚠️ Ajusta estas rutas si tu carpeta "blog" no está en la raíz del repo.
      # Si el repo ES la carpeta blog (build.py está en la raíz del repo),
      # quita el prefijo "blog/" de las 3 líneas de abajo.
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Construir el sitio
        run: python3 build.py

      - name: Evitar que Jekyll procese el sitio
        run: touch site/.nojekyll

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
